<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watch Movies Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{
  background:#0f0f0f;
  color:#fff;
  font-family:Arial;
  margin:0;
}
header{
  padding:20px;
  font-size:24px;
  background:#111;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:20px;
  padding:20px;
}
.card{
  text-decoration:none;
  color:#fff;
}
.card img{
  width:100%;
  border-radius:8px;
}
.movie{
  display:flex;
  gap:30px;
  padding:20px;
}
.container{
  max-width:1200px;
  margin:auto;
}</style>

</head>
<body>

<header>
  <h1>Movie Explorer</h1>
</header>

<div class="grid" id="movieGrid"></div>
<div id="loading">Loading...</div>

<script>const API_KEY = "e0b203e42e12587b6ce507b8aa452e8c";
const BASE = "https://api.themoviedb.org/3";
let page = 1;
let loading = false;

async function loadMovies() {
  if (loading) return;
  loading = true;

  const res = await fetch(`${BASE}/movie/popular?api_key=${API_KEY}&page=${page}`);
  const data = await res.json();

  data.results.forEach(movie => {
    const poster = movie.poster_path
      ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
      : '';

    const card = document.createElement("a");
    card.href = "/" + movie.id;
    card.className = "card";
    card.innerHTML = `
      <img loading="lazy" src="${poster}">
      <h3>${movie.title}</h3>
    `;
    document.getElementById("movieGrid").appendChild(card);
  });

  page++;
  loading = false;
}

window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
    loadMovies();
  }
});
</script>
<script>
loadMovies(); // start infinite scroll
</script>

</body>
</html>
